<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <style>
        body {
            background-color: #000000;
        }
        h1 {
            color: #ff00ff;
        }
        label {
            color: #00ffff;
        }
    </style>
    
</head>
<body>
    
    <h1>Create User</h1>
    
    <form action="/create" method="POST">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="new_username"
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="new_password"
        >

        <br><br>

        <button type="submit">Create User</button>

    </form>
    <img src="{{ url_for('static', filename='Images.jpg') }}" alt="Malcom">
</body>
</html>
