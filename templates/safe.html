<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body{
            background-color: black;
            
        }
        h1{
            color: aquamarine;
        }
        form{
            color: aliceblue;
        }
    </style>
</head>
<body>
    

    <h1>Login</h1>

    <form action="/safe" method="POST">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="user_safe"
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
