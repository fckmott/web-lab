<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vulnerable Login</title>
</head>
<body>

    <h1>Vulnerable Login</h1>

    <form action="/vuln" method="POST">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
